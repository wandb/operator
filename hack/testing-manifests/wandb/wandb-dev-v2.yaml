apiVersion: apps.wandb.com/v2
kind: WeightsAndBiases
metadata:
  name: wandb-dev-v2
spec:
  wandb:
    hostname: http://localhost
    retention:
      artifactGarbageCollection: true
      dataRetentionPeriod: 168h
    internalServiceAuth:
      enabled: true
    features:
      proxy: true
    manifestRepository: "file:///server-manifest"
    version: "0.84.0-notifications-security-flags.1"
  size: dev
  retentionPolicy:
    onDelete: detach
  mysql:
    managedMysql:
      telemetry:
        enabled: true
  redis:
    managedRedis:
      telemetry:
        enabled: true
  kafka:
    managedKafka:
      telemetry:
        enabled: true
  objectStore:
    managedObjectStore:
      telemetry:
        enabled: true
  clickhouse:
    managedClickhouse:
      telemetry:
        enabled: true

