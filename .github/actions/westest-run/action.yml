name: Run WESTest scenario
description: Run WESTest against a published operator chart or a local checkout, with a summary and optional external datastore diagnostics.

inputs:
  scenario:
    description: Supported WESTest scenario name.
    required: true
  provider:
    description: local, aws, or gcp.
    default: local
  image-tag:
    description: WESTest image tag (e.g. 0.4.0). The registry and repository are fixed by the action.
    required: true
  operator-version:
    description: Published operator chart version under test; the destination for operator upgrades. Mutually exclusive with operator-repo.
    default: ""
  operator-repo:
    description: Local operator checkout to build and load into Kind. Mutually exclusive with operator-version; local scenarios only.
    default: ""
  upgrade-from-version:
    description: Starting chart version, required only for local-kind-operator-upgrade.
    default: ""
  app-version:
    description: Published stable server-manifest version resolved once by workflow setup.
    required: true
  app-manifest-digest:
    description: Public server manifest digest resolved by workflow setup.
    required: true
  license:
    description: Optional W&B license file contents.
    default: ""
  include-external-diagnostics:
    description: Upload selected, redacted Kubernetes diagnostics for local-kind-external. Other scenarios must leave this disabled.
    default: "false"

outputs:
  result:
    description: passed or failed.
    value: ${{ steps.run.outputs.result }}
  artifact-dir:
    description: Absolute path to the staged summary and optional diagnostics directory.
    value: ${{ steps.run.outputs.artifact-dir }}

runs:
  using: composite
  steps:
    - name: Run scenario in Docker
      id: run
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        SCENARIO: ${{ inputs.scenario }}
        PROVIDER: ${{ inputs.provider }}
        WESTEST_IMAGE_TAG: ${{ inputs.image-tag }}
        OPERATOR_VERSION: ${{ inputs.operator-version }}
        OPERATOR_REPO: ${{ inputs.operator-repo }}
        OPERATOR_UPGRADE_FROM_VERSION: ${{ inputs.upgrade-from-version }}
        APP_VERSION: ${{ inputs.app-version }}
        APP_MANIFEST_DIGEST: ${{ inputs.app-manifest-digest }}
        WESTEST_LICENSE: ${{ inputs.license }}
      run: python3 "$ACTION_PATH/run.py"

    - name: Collect artifacts
      if: ${{ always() && steps.run.outputs.work-root != '' }}
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        WORK_ROOT: ${{ steps.run.outputs.work-root }}
        INCLUDE_EXTERNAL_DIAGNOSTICS: ${{ inputs.include-external-diagnostics }}
      # WESTest writes root-owned files inside the mounted work directory.
      run: sudo --preserve-env=GITHUB_STEP_SUMMARY,INCLUDE_EXTERNAL_DIAGNOSTICS python3 "$ACTION_PATH/run.py" collect "$WORK_ROOT"

    - name: Upload artifacts
      if: ${{ always() && steps.run.outputs.artifact-dir != '' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: westest-${{ inputs.scenario }}
        path: ${{ steps.run.outputs.artifact-dir }}/
        if-no-files-found: warn
        retention-days: 14
