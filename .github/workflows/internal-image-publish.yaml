name: Internal Image Publish

on:
  workflow_dispatch:
    inputs:
      image_tag:
        type: string
        description: 'Tags for Images in GAR'
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
