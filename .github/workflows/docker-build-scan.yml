name: Docker Build and Security Scan

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1, '**/v1.*']

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          pull: true
          no-cache: true
          tags: wandb/operator:${{ github.sha }}

      - name: Verify the runtime image
        env:
          IMAGE: wandb/operator:${{ github.sha }}
        run: |
          docker run --rm --entrypoint /bin/sh "${IMAGE}" -ec '
            test "$(id -u)" = 65532
            for tool in curl rpm microdnf; do
              if command -v "${tool}"; then
                echo "Unexpected runtime tool: ${tool}" >&2
                exit 1
              fi
            done
            test -z "$(find /usr/lib /usr/lib64 -name "libcurl.so*")"
            test -s /etc/pki/tls/certs/ca-bundle.crt
            test -s /var/lib/rpm/rpmdb.sqlite
            test -w "${HELM_CACHE_HOME}"
            test -w "${HELM_CONFIG_HOME}"
            test -w "${HELM_DATA_HOME}"
            /manager --help
          '

      - name: Scan OS packages and Go dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: wandb/operator:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
