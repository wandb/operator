name: Docker Build and Security Scan

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          pull: true
          no-cache: true
          tags: wandb/operator:${{ github.sha }}

      - name: Scan OS packages and Go dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: wandb/operator:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL

      - name: Reject fixable HIGH and CRITICAL vulnerabilities
        env:
          IMAGE: wandb/operator:${{ github.sha }}
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}"
