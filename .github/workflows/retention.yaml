name: Retention acceptance

on:
  pull_request:
    branches: [main, v2]
    paths:
      - 'api/**'
      - 'internal/controller/**'
      - 'internal/webhook/**'
      - 'deploy/operator/**'
      - '.github/workflows/retention.yaml'
      - '.github/actions/westest-run/**'
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        options: [pr, full]
        default: full
      operator_version:
        description: Published candidate chart; blank builds the checked-out source.
        type: string
        default: ''
      westest_ref:
        description: WESTest source revision containing the retention scenarios.
        type: string
        default: main
  workflow_call:
    inputs:
      profile:
        type: string
        default: full
      operator_version:
        type: string
        default: ''
      westest_ref:
        type: string
        default: ''
      app_version:
        type: string
        default: ''
    secrets:
      WESTEST_APP_ID:
        required: true
      WESTEST_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  setup:
    # Fork PRs keep the ordinary unit/envtest checks; maintainers can dispatch
    # acceptance explicitly. Private build assets use a narrowly scoped app token.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      app_version: ${{ steps.application.outputs.app_version }}
      app_digest: ${{ steps.application.outputs.app_manifest_digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Validate WESTest workflow helpers
        run: python3 -B -m unittest discover -s hack/scripts -p 'test_*westest.py'
      - id: matrix
        env:
          RETENTION_PROFILE: ${{ inputs.profile || 'pr' }}
        run: python3 hack/scripts/retention-westest-matrix.py
      - id: application
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: python3 hack/scripts/nightly-westest-app-version.py

  scenario:
    needs: setup
    runs-on: ubuntu-latest-8-cores
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: operator
          persist-credentials: false
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ secrets.WESTEST_APP_ID }}
          private-key: ${{ secrets.WESTEST_APP_PRIVATE_KEY }}
          owner: wandb
          repositories: |
            westest
            watchtower
          permission-contents: read
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: wandb/westest
          ref: ${{ inputs.westest_ref || vars.WESTEST_RETENTION_REF || 'main' }}
          token: ${{ steps.token.outputs.token }}
          path: westest
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: 1.27.3
          cache-dependency-path: westest/tools/runner/go.sum
      - name: Build WESTest with the scenario source
        working-directory: westest
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          test -f "scenarios/${SCENARIO}.yaml"
          bash tools/stage-assets.sh
          cd tools/runner
          CGO_ENABLED=0 go build -tags embed_assets -o "$RUNNER_TEMP/westest" ./cmd/westest
      - name: Prepare local operator image assets
        if: inputs.operator_version == ''
        working-directory: operator
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          make download-watchtower
          make download-grafana-plugins
      - name: Run the isolated Kind scenario
        uses: ./operator/.github/actions/westest-run
        with:
          scenario: ${{ matrix.scenario }}
          provider: local
          image-tag: '0.5.1'
          runner-binary: ${{ runner.temp }}/westest
          operator-repo: ${{ inputs.operator_version == '' && format('{0}/operator', github.workspace) || '' }}
          operator-version: ${{ inputs.operator_version || format('source-{0}', github.sha) }}
          upgrade-from-version: '2.0.0-beta.9'
          app-version: ${{ needs.setup.outputs.app_version }}
          app-manifest-digest: ${{ needs.setup.outputs.app_digest }}
