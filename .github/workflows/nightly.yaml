name: Nightly WESTest

# End-to-end testing of the operator via wandb/westest. Builds an operator
# image+chart and runs local Kind scenarios, plus AWS/GCP smoke tests on main.
#   - schedule                    -> nightly build (2.0.0-nightly-<timestamp>)
#   - manual (workflow_dispatch)  -> dev build (2.0.0-dev-[<tag>-]<timestamp>),
#                                    builds the dispatched branch; set `dev_tag`
#                                    to label it.
#   - manual + `operator_version` -> skip the build and test that already-published
#                                    chart version.
# See docs/nightly-westest-testing.md for setup and first-run validation.
#
# Do NOT enable the schedule trigger until the prerequisites in
# docs/nightly-westest-testing.md are met and cloud cleanup is validated.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Version channel for a manual build (schedule always uses nightly)."
        type: choice
        required: false
        default: dev
        options:
          - dev
          - nightly
      scenario:
        description: "Single supported scenario (blank = 5 local scenarios, plus AWS/GCP on main)."
        type: string
        required: false
        default: ""
      dev_tag:
        description: "Optional label for a manual dev build (version becomes 2.0.0-dev-<tag>-<timestamp>). Ignored when operator_version is set."
        type: string
        required: false
        default: ""
      operator_version:
        description: "Test against this already-published operator chart version (e.g. 2.0.0-beta.3) instead of building. When set, the build is skipped."
        type: string
        required: false
        default: ""
  # schedule:
  #   - cron: "0 7 * * *" # 07:00 UTC daily

concurrency:
  # Serialize per ref so dev builds on different branches don't block each other;
  # never cancel an in-flight run.
  group: nightly-westest-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public multi-arch image from WESTest v0.4.0; no release-download token needed.
  WESTEST_IMAGE: us-docker.pkg.dev/wandb-production/public/westest/westest@sha256:a23a657156cd5e7f9bde57d771f40877dcbd4ca919663a85a2e083ebb05dda97

jobs:
  build:
    # Skip the build when testing an already-published chart version.
    if: ${{ inputs.operator_version == '' }}
    uses: ./.github/workflows/nightly-build.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit
    with:
      # schedule -> nightly; manual -> the selected channel (default dev).
      channel: ${{ github.event_name == 'schedule' && 'nightly' || inputs.channel }}
      dev_tag: ${{ inputs.dev_tag }}

  setup:
    name: Resolve version & matrix
    needs: build
    # Run when the build succeeded OR was skipped (published-version mode).
    if: ${{ always() && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      local_matrix: ${{ steps.matrix.outputs.local_matrix }}
      cloud_matrix: ${{ steps.matrix.outputs.cloud_matrix }}
      has_local: ${{ steps.matrix.outputs.has_local }}
      has_cloud: ${{ steps.matrix.outputs.has_cloud }}
      chart_version: ${{ steps.version.outputs.chart_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Resolve operator chart version
        id: version
        env:
          OPERATOR_VERSION: ${{ inputs.operator_version }}
          BUILT_VERSION: ${{ needs.build.outputs.chart_version }}
        run: |
          set -euo pipefail
          v="${OPERATOR_VERSION:-${BUILT_VERSION}}"
          if [ -z "${v}" ]; then
            echo "no operator chart version resolved (build skipped and operator_version empty?)" >&2
            exit 1
          fi
          if [[ ! "$v" =~ ^[a-zA-Z0-9.+-]+$ ]]; then
            echo "invalid operator chart version" >&2
            exit 1
          fi
          echo "chart_version=${v}" >> "${GITHUB_OUTPUT}"
          echo "Testing operator chart version: ${v}"
      - name: Build scenario matrix
        id: matrix
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: python3 hack/scripts/nightly-westest-matrix.py

  local-test:
    name: ${{ matrix.scenario }}
    needs: [build, setup]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.setup.outputs.has_local == 'true' }}
    # The full local-kind stack needs >=8 vCPU; a standard runner leaves MySQL and
    # the ClickHouse keeper Pending on Insufficient cpu.
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.setup.outputs.local_matrix) }}
    steps:
      - name: Checkout (for the local westest-run action)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run scenario
        uses: ./.github/actions/westest-run
        with:
          scenario: ${{ matrix.scenario }}
          image: ${{ env.WESTEST_IMAGE }}
          operator-version: ${{ needs.setup.outputs.chart_version }}

  cloud-test:
    name: ${{ matrix.scenario }}
    needs: [build, setup]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.setup.result == 'success' && needs.setup.outputs.has_cloud == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    # 75m test budget + 46m cleanup grace, with room for setup and finalization.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.setup.outputs.cloud_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Authenticate to AWS
        if: ${{ matrix.provider == 'aws' }}
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::770934259321:role/WestestGitHubActions
          aws-region: us-west-2
          role-duration-seconds: 14400
          role-session-name: westest-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Authenticate to GCP
        if: ${{ matrix.provider == 'gcp' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/27586067691/locations/global/workloadIdentityPools/westest-github/providers/github
          service_account: westest-ci@playground-111.iam.gserviceaccount.com
          project_id: playground-111
          create_credentials_file: true
      - name: Run scenario
        uses: ./.github/actions/westest-run
        with:
          scenario: ${{ matrix.scenario }}
          provider: ${{ matrix.provider }}
          image: ${{ env.WESTEST_IMAGE }}
          operator-version: ${{ needs.setup.outputs.chart_version }}
          license: ${{ secrets.WESTEST_LICENSE }}

  report:
    needs: [build, setup, local-test, cloud-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarize
        run: |
          echo "build=${{ needs.build.result }} chart=${{ needs.setup.outputs.chart_version }}"
          echo "local=${{ needs.local-test.result }} cloud=${{ needs.cloud-test.result }}"
      - name: Notify on failure
        if: ${{ needs.build.result == 'failure' || needs.setup.result == 'failure' || needs.local-test.result == 'failure' || needs.cloud-test.result == 'failure' }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WESTEST_SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "no WESTEST_SLACK_WEBHOOK configured; skipping notification"
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsSL -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"WESTest failed — chart ${{ needs.setup.outputs.chart_version }} — ${run_url}\"}" \
            "${SLACK_WEBHOOK_URL}"
