name: Nightly WESTest

# Nightly end-to-end testing of the operator via wandb/westest. Builds a nightly
# operator image+chart, then runs WESTest scenarios against it on large runners.
# See docs/nightly-westest-testing.md for the full plan, prerequisites, and phases.
#
# Currently workflow_dispatch-only. Do NOT enable the schedule trigger until the
# prerequisites in docs/nightly-westest-testing.md §7 are met (notably: the
# WESTEST_APP_ID / WESTEST_APP_PRIVATE_KEY secrets for the wandb/westest App token,
# and ubuntu-latest-8-cores availability).

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Single scenario to run (blank = full default set)."
        type: string
        required: false
        default: ""
  # schedule:
  #   - cron: "0 7 * * *" # 07:00 UTC daily

concurrency:
  group: nightly-westest
  cancel-in-progress: false

env:
  # Pin the WESTest release; the action defaults to `latest`, which resolves by
  # creation date and would make nightlies non-reproducible.
  WESTEST_VERSION: v0.2.0

jobs:
  build:
    uses: ./.github/workflows/nightly-build.yaml
    permissions:
      contents: read
      id-token: write
    secrets: inherit

  setup:
    name: Resolve scenario matrix
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build scenario matrix
        id: matrix
        env:
          SCENARIO: ${{ inputs.scenario }}
          CHART_VERSION: ${{ needs.build.outputs.chart_version }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { echo "jq is required" >&2; exit 1; }

          if [ -n "${SCENARIO}" ]; then
            # Phase 0 bootstrap: a single scenario chosen at dispatch time.
            matrix="$(jq -cn --arg s "${SCENARIO}" '[{scenario: $s, params: ""}]')"
            echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Default nightly set. Smoke scenarios take the nightly chart via the
          # job-level WESTEST_OPERATOR_CHART_VERSION env (config.go); the operator
          # transition legs pin their versions explicitly via params — the
          # operator-upgrade from-leg MUST be an official release, because the
          # scenario default (2.0.0-westest-validation.0) sorts ABOVE the nightly
          # (docs/nightly-westest-testing.md §6/§8).
          #
          # App-version sweep (Phase 3): local-kind-app-upgrade has a params: block,
          # so its from/to app versions are CLI-overridable. Only published app
          # versions are safe here (an unpublished version fails at image pull).
          # 0.82.2 -> 0.83.0 are the official pins; add more pairs below as further
          # releases ship. (local-kind-app-roundtrip is intentionally NOT swept —
          # it has no params: block; see docs/nightly-westest-testing.md §8.)
          matrix="$(jq -cn --arg chart "${CHART_VERSION}" '
            [
              {scenario: "local-kind-ingress",           params: ""},
              {scenario: "local-kind-gateway",           params: ""},
              {scenario: "local-kind-oidc",              params: ""},
              {scenario: "local-kind-proxy",             params: ""},
              {scenario: "local-kind-operator-upgrade",  params: ("fromOperatorVersion=2.0.0-beta.3\ntoOperatorVersion=" + $chart)},
              {scenario: "local-kind-operator-v1-to-v2", params: ("toOperatorVersion=" + $chart)},
              {scenario: "local-kind-app-upgrade",       params: "fromAppVersion=0.82.2\ntoAppVersion=0.83.0"}
              # ,{scenario: "local-kind-app-upgrade",     params: "fromAppVersion=0.83.0\ntoAppVersion=<next-published>"}
            ]')"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  test:
    name: ${{ matrix.scenario }}
    needs: [build, setup]
    # The full local-kind stack needs >=8 vCPU; a standard runner leaves MySQL and
    # the ClickHouse keeper Pending on Insufficient cpu.
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      # Point every remote-chart scenario at the nightly chart. WESTest reads this
      # env var (config.go); the transition legs additionally override per-phase
      # via the params below.
      WESTEST_OPERATOR_CHART_VERSION: ${{ needs.build.outputs.chart_version }}
    steps:
      - name: Mint a token to read wandb/westest releases
        id: westest-token
        # GitHub App installation token scoped to wandb/westest so the action can
        # download the release binary (the operator repo's GITHUB_TOKEN can't).
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WESTEST_APP_ID }}
          private-key: ${{ secrets.WESTEST_APP_PRIVATE_KEY }}
          owner: wandb
          repositories: westest
      - name: Run scenario
        # Pinned to the westest main SHA that adds the github-token input (post-v0.2.0,
        # no release tag yet); bump to a release tag once westest cuts one.
        uses: wandb/westest/actions/run@662b59b6199d99a84435d889e7d8cf6e94ebf74c
        with:
          scenario: ${{ matrix.scenario }}
          params: ${{ matrix.params }}
          github-token: ${{ steps.westest-token.outputs.token }}
          westest-version: ${{ env.WESTEST_VERSION }}
          upload-artifacts: "true"

  report:
    needs: [build, setup, test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Summarize
        run: |
          echo "build=${{ needs.build.result }} chart=${{ needs.build.outputs.chart_version }}"
          echo "test=${{ needs.test.result }}"
      - name: Notify on failure
        if: needs.build.result != 'success' || needs.test.result != 'success'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.WESTEST_SLACK_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "no WESTEST_SLACK_WEBHOOK configured; skipping notification"
            exit 0
          fi
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -fsSL -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"Nightly WESTest failed — chart ${{ needs.build.outputs.chart_version }} — ${run_url}\"}" \
            "${SLACK_WEBHOOK_URL}"
