{{- if eq (include "telemetry.stackEnabled" .) "true" }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: {{ include "telemetry.vmsingleName" . }}
  namespace: {{ include "telemetry.namespace" . }}
  labels:
    app.kubernetes.io/component: telemetry
    app.kubernetes.io/part-of: wandb
spec:
  {{- with include "telemetry.imagePullSecrets" . }}
  imagePullSecrets:
    {{- . | nindent 4 }}
  {{- end }}
  # Update with the victoria-metrics-operator 0.66.3 chart in deploy/operator/Chart.yaml.
  image:
    repository: {{ include "telemetry.registryPrefix" . }}victoriametrics/victoria-metrics
    tag: v1.147.0
  retentionPeriod: {{ .Values.retentionPeriod | quote }}
  extraArgs:
    opentelemetry.usePrometheusNaming: "true"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: {{ include "telemetry.vmagentName" . }}
  namespace: {{ include "telemetry.namespace" . }}
  labels:
    app.kubernetes.io/component: telemetry
    app.kubernetes.io/part-of: wandb
spec:
  {{- with include "telemetry.imagePullSecrets" . }}
  imagePullSecrets:
    {{- . | nindent 4 }}
  {{- end }}
  image:
    repository: {{ include "telemetry.registryPrefix" . }}victoriametrics/vmagent
    tag: v1.147.0
  configReloaderImage: {{ include "telemetry.configReloaderImage" . | quote }}
  selectAllByDefault: true
  remoteWrite:
    - url: {{ printf "http://vmsingle-%s:8428/api/v1/write" (include "telemetry.vmsingleName" .) | quote }}
---
apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: {{ include "telemetry.vlsingleName" . }}
  namespace: {{ include "telemetry.namespace" . }}
  labels:
    app.kubernetes.io/component: telemetry
    app.kubernetes.io/part-of: wandb
spec:
  {{- with include "telemetry.imagePullSecrets" . }}
  imagePullSecrets:
    {{- . | nindent 4 }}
  {{- end }}
  image:
    repository: {{ include "telemetry.registryPrefix" . }}victoriametrics/victoria-logs
    tag: v1.51.0
  retentionPeriod: {{ .Values.retentionPeriod | quote }}
---
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: {{ include "telemetry.vtsingleName" . }}
  namespace: {{ include "telemetry.namespace" . }}
  labels:
    app.kubernetes.io/component: telemetry
    app.kubernetes.io/part-of: wandb
spec:
  {{- with include "telemetry.imagePullSecrets" . }}
  imagePullSecrets:
    {{- . | nindent 4 }}
  {{- end }}
  # Grafana Tempo datasource support requires VictoriaTraces v0.9.4 or newer.
  image:
    repository: {{ include "telemetry.registryPrefix" . }}victoriametrics/victoria-traces
    tag: v0.9.4
  retentionPeriod: {{ .Values.retentionPeriod | quote }}
{{- end }}
