{{- if .Values.auth.create }}
{{- $name := printf "%s-auth" (include "watchtower.fullname" .) }}
{{/*
Reuse the password already in the cluster. Without this lookup a plain
randAlphaNum re-rolls on every `helm upgrade`, silently locking the admin out of
an install that was working a moment earlier. lookup returns nothing under
`helm template` and `--dry-run`, so rendered output there will differ from a real
install — that is expected, not a bug.
*/}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := .Values.auth.password }}
{{- if and (not $password) $existing }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
{{- if not $password }}
{{- $password = randAlphaNum 32 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watchtower.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
