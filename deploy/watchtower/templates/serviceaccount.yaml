{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "watchtower.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "watchtower.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Unlike the W&B application pods, Watchtower calls the Kubernetes API on the
# user's behalf, so it needs its token projected.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
