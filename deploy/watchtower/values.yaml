nameOverride: ""
fullnameOverride: ""

# Watchtower runs from the operator image — its binary is copied in at build time
# as a second entrypoint (see the repository Dockerfile). Keeping the two in one
# image means one artifact to mirror for air-gapped installs.
#
# This is the chart's only tie to the operator: the two install as independent
# releases, and Watchtower needs no operator running to come up. The tag is the
# operator's version, not Watchtower's, and it tracks this chart's version — the
# release pipeline holds them equal. Digest wins when both are set.
image:
  repository: us-docker.pkg.dev/wandb-production/public/wandb/operator
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# The command that selects Watchtower rather than the operator manager.
command:
  - /watchtower

# URL prefix Watchtower serves under. It must match the prefix the image was
# built for: Next.js bakes basePath into every asset URL and router href at build
# time, and the binary refuses to start when its runtime value disagrees with the
# compiled-in one. The published Watchtower image is built with /watchtower, so
# only change this alongside an image built with a matching NEXT_PUBLIC_BASE_PATH.
basePath: /watchtower

containerPort: 8080

# Admin login. Watchtower does not implement OIDC and does not share the W&B
# app's session — published on its own origin, that cookie never reaches it. A
# single admin password gates the UI instead, and in cluster mode the binary
# refuses to start without one rather than serve cluster administration
# unauthenticated.
auth:
  # Generate the password into a Secret named <fullname>-auth on first install.
  # Existing values are reused on upgrade, so the password is stable.
  create: true
  # Pin a specific password instead of generating one. Prefer existingSecret for
  # anything real — a value here lands in the Helm release history.
  password: ""
  # Use a Secret you manage yourself. Takes precedence over create.
  existingSecret: ""
  secretKey: password

# Locks the UI to the cluster it runs in — no context switching, no teardown —
# and turns on the password gate. Only set this to "web" against a sandbox you
# do not care about: it disables the gate entirely.
mode: cluster

# Name of the WeightsAndBiases CR this Watchtower administers. Defaults to the
# release name when empty.
wandbName: ""

serviceAccount:
  create: true
  automount: true
  name: ""
  annotations: {}

role:
  create: true
  # "Role" scopes the grant to the release namespace; "ClusterRole" widens it to
  # every namespace, which Watchtower only needs when it manages installs outside
  # its own.
  type: ClusterRole
  rules:
    - apiGroups:
        - apps.wandb.com
      resources:
        - weightsandbiases
        - weightsandbiases/status
        - applications
        - applications/status
        - applications/
      verbs:
        - get
        - list
        - watch
        - create
        - update
        - patch
        - delete
    - apiGroups:
        - ""
      resources:
        - secrets
      verbs:
        - get
        - list
        - watch
        - create
        - update
        - patch
        - delete

# Watchtower's own Go HTTP server is the public entry point — there is no Ingress
# and no reverse proxy in front of it, so it is reached on a port published by
# every node. Leave nodePort empty to let Kubernetes allocate one from
# --service-node-port-range.
service:
  type: NodePort
  port: 8080
  nodePort: ""
  annotations: {}
  labels: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

env: {}
extraVolumes: []
extraVolumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}
