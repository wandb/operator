openshift:
  enabled: true

wandb-operator:
  podSecurityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null
    fsGroupChangePolicy: null

  containers:
    operator:
      env:
        OPENSHIFT:
          value: "true"

# Null these operators' hardcoded IDs so restricted-v2 assigns valid ones.
redis-operator:
  podSecurityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null
    fsGroupChangePolicy: null

altinity-clickhouse-operator:
  podSecurityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null
    fsGroupChangePolicy: null

seaweedfs-operator:
  podSecurityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null

# OpenShift ships the monitoring.coreos.com CRDs (owned by its
# cluster-version-operator), so installing the bundled copies fails helm's
# ownership import and conflicts with CVO's server-side-apply field manager.
prometheus-operator-crds:
  enabled: false

# Disable moco's injected fixed 10000 IDs so restricted-v2 admits MySQL pods.
moco:
  extraArgs:
    - --disable-default-security-context

grafana-operator:
  isOpenShift: true
