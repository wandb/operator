apiVersion: apps.wandb.com/v2
kind: Application
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: application-sample
spec:
  kind: Deployment
  podTemplate:
    metadata:
      annotations:
        foo: bar
    spec:
      containers:
      - name: my-app
        image: nginx:1.14.2

  triage:
    containerName: my-app
    command: ["/bin/echo"]
    timeoutSeconds: 60
    actions:
      - name: default
        description: Run the default application diagnostic
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi

  jobs:
    - metadata:
        name: my-job
      spec:
        template:
          spec:
            restartPolicy: Never
            containers:
            - name: my-job
              image: nginx:1.14.1
              command: ["sleep", "10"]

  cronJobs:
    - metadata:
        name: my-cronjob
      spec:
        schedule: "*/1 * * * *"
        jobTemplate:
          spec:
            template:
              spec:
                restartPolicy: Never
                containers:
                - name: my-cronjob
                  image: nginx:1.14.2
                  command: ["sleep", "10"]
