# This rule is not used by the project operator itself.
# It is provided to allow read-only access to TriageRun resources.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: triagerun-viewer-role
rules:
- apiGroups:
  - apps.wandb.com
  resources:
  - triageruns
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.wandb.com
  resources:
  - triageruns/status
  verbs:
  - get
