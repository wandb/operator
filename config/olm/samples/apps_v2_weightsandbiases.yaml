apiVersion: apps.wandb.com/v2
kind: WeightsAndBiases
metadata:
  name: weightsandbiases-sample
  labels:
    app.kubernetes.io/name: weightsandbiases
    app.kubernetes.io/instance: weightsandbiases-sample
    app.kubernetes.io/part-of: wandb-operator
    app.kubernetes.io/managed-by: olm
spec:
  size: small
  wandb:
    # Public URL users reach W&B at; front the `frontend` Service with your own ingress/Route.
    hostname: https://wandb.example.com
    # Pin to a published W&B Server version.
    version: "0.86.3"
  retentionPolicy:
    onDelete: detach
  # Moco (MySQL) is not in the OLM catalog: connect to an existing MySQL 8 instance.
  mysql:
    default:
      externalMysql:
        host:
          valueFrom:
            secretKeyRef:
              name: wandb-mysql
              key: host
        port:
          valueFrom:
            secretKeyRef:
              name: wandb-mysql
              key: port
        database:
          valueFrom:
            secretKeyRef:
              name: wandb-mysql
              key: database
        username:
          valueFrom:
            secretKeyRef:
              name: wandb-mysql
              key: username
        password:
          valueFrom:
            secretKeyRef:
              name: wandb-mysql
              key: password
  redis:
    default:
      managedRedis:
        storageSize: 5Gi
  kafka:
    managedKafka:
      storageSize: 10Gi
      replicas: 1
  # SeaweedFS is not in the OLM catalog: connect to an existing S3-compatible bucket.
  objectStore:
    default:
      externalObjectStore:
        bucket:
          valueFrom:
            secretKeyRef:
              name: wandb-object-store
              key: bucket
        accessKey:
          valueFrom:
            secretKeyRef:
              name: wandb-object-store
              key: accessKey
        secretKey:
          valueFrom:
            secretKeyRef:
              name: wandb-object-store
              key: secretKey
        region:
          valueFrom:
            secretKeyRef:
              name: wandb-object-store
              key: region
  clickhouse:
    default:
      managedClickhouse:
        storageSize: 10Gi
        replicas: 1
